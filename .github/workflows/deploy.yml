name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Checks (translations, contrast, database rules, matching engine)
        run: npm run check:i18n && npm run check:contrast && npm run test:db && npm test

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build static site
        # The URL and publishable key are public by design (they ship inside the site), so
        # repository variables are enough; secrets of the same names work too. The site uses
        # Supabase only once its database is set up (supabase/setup.sql); until then, demo mode.
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::notice::No Supabase project set: building in demo mode (the database runs in the browser)."
          else
            code=$(curl -s -o /dev/null -w "%{http_code}" "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/items?select=id&limit=1" -H "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY")
            if [ "$code" = "200" ]; then
              echo "::notice::Building against Supabase."
            else
              echo "::warning::Supabase is set, but its database isn't set up yet (HTTP $code): building in demo mode. Run supabase/setup.sql in the SQL Editor, then re-run this workflow."
              unset NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY
            fi
          fi
          npm run build
        env:
          # /<repo-name> for a project site; empty for <user>.github.io
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
