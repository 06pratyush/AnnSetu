name: Keep Supabase awake

# Free Supabase projects pause after 7 days without traffic. One tiny read every 3 days keeps
# the database awake. GitHub turns scheduled workflows off after 60 days with no repository
# activity; if that happens, re-enable this workflow from the Actions tab.
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one market listing
        env:
          URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Supabase not set up yet; nothing to keep awake."; exit 0; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/market_listings?select=id&limit=1" -H "apikey: $KEY")
          echo "Supabase answered $code"
          test "$code" = "200"
